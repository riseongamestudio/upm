name: Pack release

# Called by each RiseOn pack repo when a tag is pushed: publishes that package version as a release of the pack repo.
on:
  workflow_call:
    secrets:
      UPM_INDEX_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_INDEX_TOKEN: ${{ secrets.UPM_INDEX_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: riseongamestudio/upm
          path: .upm

      - run: python3 .upm/pack_release.py "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Indexes the new release at once: GitHub runs the Index's schedule only every few hours.
      - name: Index the release
        if: env.HAS_INDEX_TOKEN == 'true'
        run: gh workflow run index.yml -R riseongamestudio/upm
        env:
          GH_TOKEN: ${{ secrets.UPM_INDEX_TOKEN }}
