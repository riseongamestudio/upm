name: Mirror

on:
  schedule:
    # Every 5 minutes, GitHub's shortest, off the hour's start when its load delays or drops runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: registry
          path: site

      - id: mirror
        run: python3 mirror.py site
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save the registry
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Mirror ${{ steps.mirror.outputs.added }} package versions"
          git push origin HEAD:registry

      # GitHub turns off the schedule of a public repo without activity for 60 days; enabling it again restarts that count.
      - name: Keep the schedule on
        run: gh workflow enable mirror.yml -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.mirror.outputs.deploy == '1'
        uses: actions/configure-pages@v5

      - if: steps.mirror.outputs.deploy == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: steps.mirror.outputs.deploy == '1'
        uses: actions/deploy-pages@v4
